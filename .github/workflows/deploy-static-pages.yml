name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - static
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Check out Dredge (browser runtime source)
        # The Python CLI is installed from git via uv; the JS runtime is not on
        # npm, so clone the same repo as a sibling of the workspace. The
        # static-dredge-assets task builds it from ../dredge.
        run: git clone --depth 1 https://github.com/artshumrc/dredge.git ../dredge

      - name: Install Python tooling
        run: uv sync --group dev

      - name: Install Dredge runtime dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ../dredge/runtime

      - name: Build static site
        run: uv run poe static-build-production

      - name: Build Dredge search index
        run: uv run poe static-dredge

      - name: Prepare Pages artifact
        run: |
          # The client only downloads the brotli-compressed database; drop the
          # uncompressed intermediate so it is not shipped in the Pages artifact.
          rm -f dist/search/*.db
          printf '%s\n' 'giza.fas.harvard.edu' > dist/CNAME
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Large site (tens of thousands of files); the default 10 min timeout
          # is not enough for Pages to finish syncing.
          timeout: 600000
