[project]
name = "giza"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "poethepoet>=0.32.0",
]

[tool.poe.tasks.static-build-staging]
cmd = "python scripts/build_static_site.py --es-archive static_site/giza-es-export.tar.gz --django-content-dump static_site/giza-content-dump.json.gz --output dist --base-url https://giza-static.digitalhumanities.fas.harvard.edu"

[tool.poe.tasks.static-build-production]
cmd = "python scripts/build_static_site.py --es-archive static_site/giza-es-export.tar.gz --django-content-dump static_site/giza-content-dump.json.gz --output dist --base-url http://giza.fas.harvard.edu"

[tool.poe.tasks.static-pagefind]
cmd = "npx -y pagefind --site dist"

[tool.poe.tasks.static-serve]
cmd = "python -m http.server --directory dist 8000"
