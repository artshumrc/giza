[project]
name = "giza"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "django>=5.2",
    "poethepoet>=0.32.0",
]

[tool.poe.tasks.static-build-staging]
cmd = "python scripts/build_static_site.py --es-archive static_site/giza-es-export.tar.gz --django-content-dump static_site/giza-content-dump.json.gz --output dist --base-url https://giza.digitalhumanities.fas.harvard.edu"

[tool.poe.tasks.static-build-production]
cmd = "python scripts/build_static_site.py --es-archive static_site/giza-es-export.tar.gz --django-content-dump static_site/giza-content-dump.json.gz --output dist --base-url https://giza.fas.harvard.edu"

[tool.poe.tasks.static-build-local]
cmd = "python scripts/build_static_site.py --es-archive static_site/giza-es-export.tar.gz --django-content-dump static_site/giza-content-dump.json.gz --output dist --base-url http://localhost:8000"

[tool.poe.tasks.static-build-limited]
cmd = "python scripts/build_static_site.py --es-archive static_site/giza-es-export.tar.gz --django-content-dump static_site/giza-content-dump.json.gz --output /tmp/opencode/giza-static-test --base-url http://localhost:8000 --item-limit-per-type 1 --manifest-limit 5"

[tool.poe.tasks.static-pagefind]
cmd = "npx -y pagefind --site dist"

[tool.poe.tasks.static-pagefind-limited]
cmd = "npx -y pagefind --site /tmp/opencode/giza-static-test"

[tool.poe.tasks.static-dredge-assets]
cmd = "node dredge/runtime/scripts/install-into-site.mjs --out dist"
help = "Build the Dredge browser library and install it into dist/search."

[tool.poe.tasks.static-dredge-assets-limited]
cmd = "node dredge/runtime/scripts/install-into-site.mjs --out /tmp/opencode/giza-static-test"
help = "Build the Dredge browser library and install it into the limited build."

[tool.poe.tasks.static-dredge-compile]
cmd = "uv run --project dredge dredge compile -c dredge.config.json"
help = "Compile the Dredge SQLite/FTS5 index from dist/ into dist/search."

[tool.poe.tasks.static-dredge-compile-local]
cmd = "uv run --project dredge dredge compile -c dredge.config.json --brotli-quality 1"
help = "Compile the Dredge index for local development with fast Brotli compression."

[tool.poe.tasks.static-dredge-compile-limited]
cmd = "uv run --project dredge dredge compile -c dredge.config.limited.json"
help = "Compile the Dredge index for the limited build."

[tool.poe.tasks.static-dredge]
sequence = [
    { ref = "static-dredge-assets" },
    { ref = "static-dredge-compile" },
]
help = "Build + install the Dredge library and compile its index into dist/search."

[tool.poe.tasks.static-dredge-local]
sequence = [
    { ref = "static-dredge-assets" },
    { ref = "static-dredge-compile-local" },
]
help = "Dredge library + fast local index for dist/search."

[tool.poe.tasks.static-dredge-limited]
sequence = [
    { ref = "static-dredge-assets-limited" },
    { ref = "static-dredge-compile-limited" },
]
help = "Dredge library + index for the limited build."

[tool.poe.tasks.static-serve]
cmd = "python -m http.server --directory dist ${port}"

[[tool.poe.tasks.static-serve.args]]
name = "port"
default = "8000"
positional = true

[tool.poe.tasks.static-serve-limited]
cmd = "python -m http.server --directory /tmp/opencode/giza-static-test 8000"
